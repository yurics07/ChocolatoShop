<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chocolato Shop</title>
    <!-- Caminho correto para o CSS (está na mesma pasta) -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Caminho correto para o ícone -->
    <link rel="icon" href="imagens/chocolato-removebg-preview.png" type="image/png">
</head>
<body>
    <!-- Reutiliza o estilo do header de cadastro -->
    <header class="registration-header">
        <div class="logo">
            <!-- Caminho correto para o index.html -->
            <a href="index.html" class="logo-link">
                <h1>Chocolato Shop</h1>
            </a>
        </div>
    </header>

    <!-- Reutiliza o estilo do main de cadastro -->
    <main class="registration-main">
        <!-- Reutiliza o estilo do container de cadastro -->
        <div class="registration-container">
            <h2>Acesse sua Conta</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Senha:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                 <div id="login-error" class="error-message" style="display: none;"></div> <!-- Mensagem de erro -->
                <button type="submit" id="login-button">Entrar</button>
            </form>
            <p class="extra-links"> <!-- Classe para links extras -->
                <a href="#">Esqueceu a senha?</a>
            </p>
            <p class="extra-links">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se</a> <!-- Link para cadastro -->
                <br>
                <a href="index.html">Voltar para a Loja</a>
            </p>
        </div>
    </main>

     <div id="toast" class="toast"></div> <!-- Reutiliza o toast para mensagens -->

    <footer> <!-- Footer simples -->
        <p>&copy; 2024 Chocolato Shop. Todos os direitos reservados.</p>
    </footer>

    <!-- Caminho correto para o script JS (está na mesma pasta) -->
    <script src="script.js"></script>
</body>
</html>
